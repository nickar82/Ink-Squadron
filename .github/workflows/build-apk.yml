name: Build Ink Squadron APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME); Gradle fetches anything missing.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          # also build an (unsigned) minified release to catch R8/shrinker problems early
          if [ -z "$KS" ]; then ./gradlew --no-daemon assembleRelease; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: InkSquadron-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Optional: signed release build (AAB for Google Play + APK).
      # Add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD to enable.
      - name: Check AdMob ids
        run: |
          if grep -q "ca-app-pub-3940256099942544" app/src/main/res/values/ids.xml; then
            echo "::warning title=AdMob test ids::ids.xml still has Google's TEST ad ids. Replace them before uploading to Google Play."
          fi

      - name: Build signed release
        if: env.KS != ''
        env:
          INK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf "%s" "$KS" | tr -d " \r\n\t" | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$(printf "%s" "$INK_KEYSTORE_PASSWORD" | tr -d " \r\n\t")" > /dev/null && echo "Keystore password OK" || echo "::error title=Keystore::KEYSTORE_PASSWORD does not open the keystore (check the secret value)"
          export INK_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload release
        if: env.KS != ''
        uses: actions/upload-artifact@v4
        with:
          name: InkSquadron-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
